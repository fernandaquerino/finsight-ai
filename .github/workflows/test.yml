name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finsight_ai_test
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://finsight:finsight@localhost:5432/finsight_ai_test
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://finsight:finsight@localhost:5432/finsight_ai_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit and integration tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
