<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="FinSight favicon">
  <title>FinSight</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EEEDFE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EEEDFE" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- fundo arredondado -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- linha de pulso financeiro — ícone minimalista -->
  <!-- baseline -->
  <line x1="4" y1="21" x2="28" y2="21" stroke="#EEEDFE" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- sparkline: sinal financeiro com spike -->
  <polyline
    points="4,21  8,21  11,12  13,24  15,17  18,21  28,21"
    stroke="url(#pulse)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- ponto vivo no pico -->
  <circle cx="11" cy="12" r="2.5" fill="#EEEDFE" fill-opacity="0.3"/>
  <circle cx="11" cy="12" r="1.4" fill="#EEEDFE"/>
</svg>
