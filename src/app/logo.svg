<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none" role="img" aria-label="FinSight AI logo">
  <title>FinSight AI</title>
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AFA9EC" stop-opacity="0"/>
      <stop offset="40%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <clipPath id="icon-clip">
      <rect x="0" y="0" width="36" height="36" rx="9"/>
    </clipPath>
  </defs>

  <!-- ── ÍCONE ── -->
  <!-- fundo com gradiente sutil -->
  <rect x="0" y="2" width="36" height="36" rx="9" fill="url(#icon-grad)"/>

  <!-- linha de pulso financeiro (sparkline estilizado) -->
  <!-- baseline horizontal muito fina -->
  <line x1="5" y1="23.5" x2="31" y2="23.5" stroke="#AFA9EC" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- pulso principal: flat → spike → descida → recovery -->
  <polyline
    points="5,23  10,23  13,14  15,26  17,19  20,23  31,23"
    stroke="url(#pulse-grad)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- ponto vivo no topo do spike -->
  <circle cx="13" cy="14" r="2.2" fill="#EEEDFE"/>
  <circle cx="13" cy="14" r="1.2" fill="#534AB7"/>

  <!-- traço diagonal alto-direito: representa "insight" / visão -->
  <line x1="23" y1="9" x2="30" y2="9" stroke="#AFA9EC" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="23" y1="12.5" x2="28" y2="12.5" stroke="#AFA9EC" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- ── WORDMARK ── -->
  <!-- "Fin" em peso regular, "Sight" em peso médio, espaçamento apertado e moderno -->
  <text
    x="43"
    y="25"
    font-family="'SF Pro Display', 'DM Sans', 'Geist', system-ui, sans-serif"
    font-size="18"
    font-weight="300"
    letter-spacing="-0.3"
    fill="#534AB7"
  >Fin</text>

  <text
    x="68"
    y="25"
    font-family="'SF Pro Display', 'DM Sans', 'Geist', system-ui, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.5"
    fill="currentColor"
  >Sight</text>

  <!-- "AI" — badge pequeno, técnico -->
  <rect x="126" y="14" width="18" height="11" rx="3" fill="#EEEDFE"/>
  <text
    x="135"
    y="22.5"
    text-anchor="middle"
    font-family="'SF Mono', 'Geist Mono', 'Fira Code', monospace"
    font-size="7.5"
    font-weight="600"
    letter-spacing="0.5"
    fill="#534AB7"
  >AI</text>
</svg>
